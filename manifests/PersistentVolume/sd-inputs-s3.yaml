apiVersion: v1
kind: PersistentVolume
metadata:
  name: comfyui-inputs-pv
  labels:
    project: comfyui-on-eks
spec:
  capacity:
    storage: 1200Gi # ignored, required
  accessModes:
    - ReadWriteMany # supported options: ReadWriteMany / ReadOnlyMany
  mountOptions:
    - allow-delete
    - region REGION
    # Mountpoint CSI v2 runs mount-s3 as uid 1000, so the mount is owned by 1000 with mode
    # 755. The ComfyUI container runs as root but drops ALL capabilities (no
    # CAP_DAC_OVERRIDE), so root is held to those mode bits and every write failed
    # (UI image uploads returned HTTP 500). Mountpoint rejects uid/gid 0, so widen the
    # mode instead; the mount is private to this single-user pod.
    - dir-mode 0777
    - file-mode 0666
    # ComfyUI replaces input images in place (uploads with overwrite=true, the mask
    # editor saving an edited mask). Without this Mountpoint refuses to overwrite an
    # existing object and the upload fails with EPERM / HTTP 500.
    - allow-overwrite
  csi:
    driver: s3.csi.aws.com # required
    volumeHandle: s3-csi-driver-volume-inputs # need to be unique
    volumeAttributes:
      bucketName: comfyui-inputs-ACCOUNT_ID-REGION
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-inputs-pvc
spec:
  accessModes:
    - ReadWriteMany # supported options: ReadWriteMany / ReadOnlyMany
  storageClassName: "" # required for static provisioning
  resources:
    requests:
      storage: 1200Gi # ignored, required
  volumeName: comfyui-inputs-pv
