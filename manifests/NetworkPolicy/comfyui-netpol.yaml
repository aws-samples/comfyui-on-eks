apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comfyui-allow-ingress
  namespace: default
  labels:
    project: comfyui-on-eks
spec:
  podSelector:
    matchLabels:
      app: comfyui
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        # VPC CIDR — in production, scope to ALB subnet CIDRs for least-privilege
        cidr: 10.2.0.0/16
    ports:
    - port: 8848
  egress:
  - {}
