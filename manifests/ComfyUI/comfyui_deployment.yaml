apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  labels:
    app: comfyui
    project: comfyui-on-eks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
        project: comfyui-on-eks
    spec:
      serviceAccountName: comfyui-sa
      volumes:
      - name: stable-diffusion-models
        hostPath:
          path: /comfyui-models # Need to sync all models in node's user-data
      - name: comfyui-inputs
        persistentVolumeClaim:
          claimName: comfyui-inputs-pvc # Need to apply sd-inputs-s3.yaml first
      - name: comfyui-outputs
        persistentVolumeClaim:
          claimName: comfyui-outputs-pvc # Need to apply sd-outputs-s3.yaml first
      containers:
      - name: comfyui
        image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/comfyui-images:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8848
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - mountPath: /app/ComfyUI/models
          name: stable-diffusion-models
        - mountPath: /app/ComfyUI/input
          name: comfyui-inputs
        - mountPath: /app/ComfyUI/output
          name: comfyui-outputs
        resources:
          requests:
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
