apiVersion: v1
kind: Service
metadata:
  name: comfyui-service
  labels:
    app: comfyui
    project: comfyui-on-eks
spec:
  selector:
    app: comfyui
  ports:
  - port: 8848
    protocol: TCP
    targetPort: 8848
  type: NodePort
---
# NOTE: This ingress does not include authentication. For production use, add
# ALB authentication (Cognito/OIDC) via alb.ingress.kubernetes.io/auth-type annotation.
# See README for guidance on adding authentication.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comfyui-ingress
  labels:
    project: comfyui-on-eks
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=300
    # Raise the ALB idle timeout (default 60s) so the ComfyUI progress WebSocket is not
    # torn down between generations, which surfaced as "Reconnecting/Reconnected" every
    # ~60s (issue #27). 4000s is the ALB maximum.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=4000
    alb.ingress.kubernetes.io/tags: Project=comfyui-on-eks
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: comfyui-service
              port:
                number: 8848
